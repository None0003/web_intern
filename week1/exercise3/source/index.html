<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href='style.css' rel='stylesheet'>
    <title>Thông tin nhân viên</title>
</head>
<body>
    <div class="container box">
        <div class="text-center pt-5 title"><h1>THÔNG TIN NHÂN VIÊN</h1></div>
        <form class="row needs-validation" id="employeeInformation" action=""  novalidate>
            <div class="col-md-2"></div>
            <div class="form-row col-md-8 my-3 ">
                <div class="form-group my-3">
                    <label for="inputName">Họ tên</label>
                    <input type="text" pattern="[a-zA-Z][a-zA-Z ]{2,}" class="form-control mt-1" id="inputName" placeholder="Họ tên" required>
                    <div class="invalid-feedback">
                        Hãy nhập họ và tên chính xác
                    </div>
                </div>
                <div class="form-group my-3">
                    <label for="inputBirthday">Ngày sinh</label>
                    <input type="date" class="form-control mt-1" id="inputBirthday" required>
                    <div class="invalid-feedback">
                        Hãy nhập ngày sinh khả dụng
                    </div>
                </div>
                <div class="form-group my-3">
                    <label for="inputPhoneNumber">Số điện thoại</label>
                    <input type="tel" pattern="^\d{10}$" class="form-control mt-1" id="inputPhoneNumber" placeholder="Số điện thoại">
                    <div class="invalid-feedback">
                        Hãy nhập số điện thoại khả dụng
                    </div>
                </div>
                <div class="form-group my-3">
                    <label for="inputEmail">Email</label>
                    <input type="email" class="form-control mt-1" id="inputEmail" placeholder="Email">
                    <div class="invalid-feedback">
                        Hãy nhập email khả dụng
                    </div>
                </div>
                <div class="form-group my-3">
                    <label for="inputGender">Giới tính</label>
                    <select id="inputGender" class="form-control form-select mt-1" required>
                        <option selected disabled value="">Chọn...</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                    <div class="invalid-feedback">
                        Hãy chọn giới tính
                    </div>
                </div>
                <div class="form-group my-3">
                    <label for="inputAddress">Địa chỉ</label>
                    <input type="text" class="form-control mt-1" id="inputAddress" placeholder="Địa chỉ">
                </div>
                <button class="btn btn-primary my-5" type="submit">Lưu thông tin</button>
            </div>
            <div class="col-md-2"></div>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
