<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href='style.css' rel='stylesheet'>
    <title>Profile</title>
</head>
    <body>
        <div class="box container" >
            <div class="my-5 row-md-3 pt-5 d-flex justify-content-center">
                <img id="avatar" class="rounded-circle img-fluid avatar" src="..\img\test_profile.jpg" alt="Profile Picture">
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>
            <div class="row-md-3 information">
                <div class="mt-3 d-flex justify-content-center text-center name"><h2 id="name"><strong>LÊ QUỐC KHÁNH</strong></h2></div>
                <div class="mt-5 text-center">
                    <h4>GIỚI THIỆU</h4>
                </div>
                <div id="description" class="mt-3 text-center description">
                    <p>Sinh viên năm 4 tại Trường Đại học Khoa học Tự nhiên - ĐHQGHN <br> Khoa Toán - Cơ - Tin học <br> Ngành Toán Tin</p>
                </div>
                <div class="mt-5 text-center">
                    <h4>SỞ THÍCH</h4>
                </div>
                <div class="mt-3">
                    <div class="row">
                        <div class="col-md-4"></div>
                        <div class="col-md-4"><ul id="hobby-list" class="ms-5 ps-5"></ul></div>
                        <div class="col-md-4"></div>
                    </div>
                    <ul id="hobby-list"></ul>
                    <div class="d-flex justify-content-center">
                        <input type="text" id="new-hobby" class="ps-3 input-hobby" placeholder="Nhập sở thích"><button onclick="addHobby()" class="mx-3 add-btn">Thêm</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
