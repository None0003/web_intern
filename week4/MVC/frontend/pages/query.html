<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href='../assets/css/style.css' rel='stylesheet'>
    <title>Truy Vấn Dữ Liệu</title>
</head>
<body class="d-flex flex-column vh-100">
    <header>
        <div class="bg-dark">
            <div class="container py-3 d-flex">
                <div class="me-5 fs-5">
                    <a href="../pages/index.html" class="text-decoration-none text-white">Quản lý nhân viên</a>
                </div>
                <div class="me-5 fs-5">
                    <a href="../pages/query.html" class="text-decoration-none text-white">Truy vấn dữ liệu</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div class="col-md-3 d-flex justify-content-center align-items-center h-100">
            <div class="p-1 w-100 rounded bg-white border border-success">
                <div class="bg-white h-100 rounded">
                    <div class="title text-center my-4 h5">
                        <strong>Truy vấn dữ liệu</strong>
                    </div>
                    <form class="query-select m-4 d-flex flex-column justify-content-center" id="queryForm">
                        <select class="form-select" id="type" required onchange="toggleMonthSelect()">
                            <option selected disabled value="">Chọn truy vấn</option>
                            <option value="1">Nhân viên và phòng ban nhân viên</option>
                            <option value="2">Tính tổng lương nhân viên trong 1 tháng</option>
                            <option value="3">Lấy danh sách nhân viên trong mỗi phòng ban</option>
                        </select>

                        <div id="monthSelectContainer" class="d-none mt-3 d-flex">
                            <input type="month" class="form-control" id="month">
                        </div>

                        <button type="submit" class="btn btn-success mt-4">Truy vấn</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-1"></div>
        <div class="col-md-7 ms-5 d-flex justify-content-center align-items-center h-100">
            <div class="p-1 w-100 h-75 bg-white">
                <div class="bg-white h-75 rounded">
                    <div class="result-title text-center my-4 h5">
                        <!-- <strong>Kết quả truy vấn</strong> -->
                    </div>
                    <div class="h-100 m-4 result"></div>
                </div>
            </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

<script>
    function toggleMonthSelect() {
        let typeSelect = document.getElementById("type");
        let monthSelectContainer = document.getElementById("monthSelectContainer");
        if (typeSelect.value === "2") {
            monthSelectContainer.classList.remove("d-none");
            monthSelectContainer.classList.add("d-block");
        } else {
            monthSelectContainer.classList.add("d-none"); 
            monthSelectContainer.classList.remove("d-block");
        }
    }

    document.getElementById("queryForm").addEventListener("submit", function(event) {
        event.preventDefault();
        let type = Number(document.getElementById("type").value);
        month = null;

        if (type == "2") {
            month = document.getElementById("month").value;
        }

        fetchEmployeesData(type, month);
    });

    async function fetchEmployeesData(type, month) {
        let url = `http://localhost:8000/query?type=${type}`;

        if (month) {
            url += `&month=${month}`;
        }

        try {
            let response = await fetch(url);
            let data = await response.json();
            let resultTitleDiv = document.querySelector(".result-title");
            let resultDiv = document.querySelector(".result");
            resultDiv.innerHTML = "";
            resultTitleDiv.innerHTML = `<div class="title text-center my-4 h5"><strong>Kết quả truy vấn</strong></div>`;

            if (response.ok && data) {
                let table = `<table class="table table-bordered">
                    <thead><tr>`;

                switch (type) {
                    case 1:
                        table += "<th>Mã nhân viên</th><th>Tên nhân viên</th><th>Tên phòng ban</th><th>Chức vụ</th></tr></thead><tbody>";
                        data.forEach((item) => {
                            table += `<tr>
                                <td>${item.id_nhan_vien ?? "N/A"}</td>
                                <td>${item.ho_ten ?? "N/A"}</td>
                                <td>${item.ten_phong_ban ?? "N/A"}</td>
                                <td>${item.chuc_vu ?? "N/A"}</td>
                            </tr>`;
                        });
                        break;

                    case 2:
                        table += "<th>Tháng nhận lương</th><th>Tổng lương</th></tr></thead><tbody>";
                        if (data && typeof data === "object" && data.thang_nhan_luong) {  
                            table += `<tr>
                                <td>${data.thang_nhan_luong}</td>
                                <td>${Number(data.tong_luong).toLocaleString()} VND</td>
                            </tr>`;
                        } else {
                            console.warn("⚠ Không có dữ liệu hợp lệ!", data);
                            table += `<tr><td colspan="2">Không có dữ liệu</td></tr>`;
                        }
                        break;

                    case 3:
                        let groupedData = {};
                        data.forEach(item => {
                            let idPhongBan = item.id_phong_ban;
                            
                            if (!groupedData[idPhongBan]) {
                                groupedData[idPhongBan] = {
                                    id_phong_ban: item.id_phong_ban,
                                    ten_phong_ban: item.ten_phong_ban,
                                    nhan_vien: [] 
                                };
                            }
                            if (item.nhan_vien) {
                                groupedData[idPhongBan].nhan_vien.push(item.nhan_vien.ho_ten);
                            }
                        });

                        table += "<th>Mã phòng ban</th><th>Tên phòng ban</th><th>Danh sách nhân viên</th></tr></thead><tbody>";
                        Object.values(groupedData).forEach(item => {
                            let danhSachNhanVien = item.nhan_vien.length ? item.nhan_vien.join(", ") : "Không có nhân viên";
                            table += `<tr>
                                        <td>${item.id_phong_ban ?? "N/A"}</td>
                                        <td>${item.ten_phong_ban ?? "N/A"}</td>
                                        <td>${danhSachNhanVien}</td>
                                    </tr>`;
                        });
                        break;

                    default:
                        resultDiv.innerHTML = `<div class="alert alert-warning">Không có dữ liệu phù hợp</div>`;
                        return;
                }

                table += "</tbody></table>";
                resultDiv.innerHTML = table;
            } else {
                resultDiv.innerHTML = `<div class="alert alert-warning">Không có dữ liệu</div>`;
            }
        } catch (error) {
            console.error("Lỗi khi gọi API:", error);
            resultDiv.innerHTML = `<div class="alert alert-danger">Lỗi kết nối đến API!</div>`;
        }
    }
</script>

</html>
