<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href='../assets/css/style.css' rel='stylesheet'>
    <title>Thêm nhân viên</title>
</head>
<body class="d-flex flex-column vh-100">
    <header>
        <div class="bg-dark">
            <div class="container py-3 d-flex">
                <div class="me-5 fs-5">
                    <a href="../pages/index.html" class="text-decoration-none text-white">Quản lý nhân viên</a>
                </div>
                <div class="me-5 fs-5">
                    <a href="../pages/query.html" class="text-decoration-none text-white">Truy vấn dữ liệu</a>
                </div>
            </div>
        </div>
    </header>
    <div class="container-fluid d-flex justify-content-center align-items-center flex-grow-1">
        <div class="search-box py-4 w-100">
            <div class="box-title mx-4 text-center">
                <h3>Thêm Nhân Viên</h3>
            </div>
            <form id="employeeForm" class="mx-5 px-5" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">Họ và tên:</label>
                    <input type="text" class="form-control" id="name" placeholder="Nhập tên nhân viên" required>
                </div>
                <div class="form-group my-3">
                    <label for="dateOfBirth">Ngày sinh:</label>
                    <input type="date" class="form-control" id="dateOfBirth" required>
                </div>
                <div class="d-flex my-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="1" checked>
                        <label class="form-check-label" for="male">Nam</label>
                    </div>
                    <div class="form-check ms-5">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="2">
                        <label class="form-check-label" for="female">Nữ</label>
                    </div>
                </div>
                <div class="form-group my-3">
                    <label for="phoneNumber">Số điện thoại:</label>
                    <input type="tel" pattern="^\d{10}$" class="form-control mt-1" id="phoneNumber" placeholder="Nhập số điện thoại" required>
                </div>
                <div class="form-group my-3">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                </div>
                <div class="form-group my-3">
                    <label for="address">Địa chỉ:</label>
                    <input type="text" class="form-control" id="address" placeholder="Nhập địa chỉ" required>
                </div>
                <div class="form-group my-3">
                    <label for="department">Phòng ban:</label>
                    <select class="form-select" id="department" aria-label="Default select example" required>
                        <option selected disabled value="">Chọn phòng ban</option>
                        <option value="1">Phòng Kế Toán</option>
                        <option value="2">Phòng Nhân Sự</option>
                        <option value="3">Phòng IT</option>
                        <option value="4">Phòng Kinh Doanh</option>
                    </select>
                </div>
                <div class="form-group my-3">
                    <label for="position">Chức vụ:</label>
                    <input type="text" class="form-control" id="position" placeholder="Nhập chức vụ" required>
                </div>
                <div class="mb-4">
                    <label for="avatar" class="form-label">Ảnh đại diện:</label>
                    <input class="form-control" type="file" id="avatar" name="avatar">
                </div>
                <button type="submit" class="btn btn-primary">Thêm</button>
            </form>
            <div id="message" class="alert mt-3 d-none"></div>
        </div>
    </div>

    <script>
        document.getElementById("employeeForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let formData = new FormData();
            formData.append("name", document.getElementById("name").value);
            formData.append("dateOfBirth", document.getElementById("dateOfBirth").value);
            formData.append("gender", document.querySelector('input[name="gender"]:checked').value);
            formData.append("phoneNumber", document.getElementById("phoneNumber").value);
            formData.append("email", document.getElementById("email").value);
            formData.append("address", document.getElementById("address").value);
            formData.append("department", document.getElementById("department").value);
            formData.append("position", document.getElementById("position").value);

            let avatarFile = document.getElementById("avatar").files[0];
            let resultDiv = document.querySelector("#message");
            let message = document.getAnimations("message");

            fetch("http://localhost:8000/add-employees", {
                method: "POST",
                body: formData 
            })
            .then(response => response.json())
            .then(data => {
                if (data["statusCode"] == 500) {
                    resultDiv.classList.remove("d-none");
                    resultDiv.innerHTML = `<div class="alert alert-danger text-center">Đã xảy ra lỗi khi thêm nhân viên</div>`;
                } else {
                    resultDiv.classList.remove("d-none");
                    resultDiv.innerHTML = `<div class="alert alert-success text-center">Thêm nhân viên thành công!</div>`;
                }
            })
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
