<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href='../assets/css/style.css' rel='stylesheet'>
    <title>Quản lý nhân viên</title>
</head>
<body class="d-flex flex-column vh-100">
    <header>
        <div class="bg-dark">
            <div class="container py-3 d-flex">
                <div class="me-5 fs-5">
                    <a href="../pages/index.html" class="text-decoration-none text-white">Quản lý nhân viên</a>
                </div>
                <div class="me-5 fs-5">
                    <a href="../pages/query.html" class="text-decoration-none text-white">Truy vấn dữ liệu</a>
                </div>
            </div>
        </div>
    </header>
    <div class="container-fluid p-5">
        <h3 class="text-center">Quản lý nhân viên</h3>
        <div class="employee-list m-3"></div>
        <div class="add-employee">
            <button class="btn btn-primary ms-3"><a href="./add-employee.html" class="text-decoration-none text-white">Thêm nhân viên</a></button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

<script>
    async function fetchEmployeesData() {
        let url = `http://localhost:8000/employee-list`;

        let response = await fetch(url);
        let data = await response.json();
        let resultDiv = document.querySelector(".employee-list");
        resultDiv.innerHTML = "";

        if (response.ok && data) {
            let table = `<table class="table table-bordered"><thead><tr>`;

            table += "<th class='text-center'>Mã nhân viên</th><th class='text-center'>Tên nhân viên</th><th class='text-center'>Ngày sinh</th><th class='text-center'>Giới tính</th><th class='text-center'>Số điện thoại</th><th class='text-center'>Email</th><th class='text-center'>Địa chỉ</th><th class='text-center'>Avatar</th><th class='text-center'>Hành động</th></tr></thead><tbody>";
            data.forEach((item) => {
                table += `<tr>
                    <td>${item.id_nhan_vien ?? "N/A"}</td>
                    <td>${item.ho_ten ?? "N/A"}</td>
                    <td>${item.ngay_sinh ?? "N/A"}</td>
                    <td>${item.gioi_tinh === 1 ? "Nam" : item.gioi_tinh === 2 ? "Nữ" : "N/A"}</td>
                    <td>${item.so_dien_thoai ?? "N/A"}</td>
                    <td>${item.email ?? "N/A"}</td>
                    <td>${item.dia_chi ?? "N/A"}</td>
                    <td>${item.avatar ?? "Không có"}</td>
                    <td class='d-flex justify-content-center'>
                        <button class="btn btn-warning px-4">Sửa</button>
                        <button class="btn btn-danger px-4 ms-3">Xóa</button>
                    </td>
                </tr>`;
            });
            table += "</tbody></table>";
            resultDiv.innerHTML = table;
        }
            
    }

    fetchEmployeesData();
</script>
</html>
