<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href='../assets/css/login_pa4_style.css' rel='stylesheet'>
    <title>Login</title>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-lg-5 login-box">
            <div class="row mx-2 d-flex justify-content-center align-items-center position-relative">
                <div class="mt-5 mb-5 logo-img">
                    <img src="..\assets\img\logo-minerva-cut.png" class="img-fluid" alt="">
                    <div class="text-center pt-3 logo-name"><strong>MINERVA PACS</strong></div>
                </div>
                <div class="text-center box-description">
                    <p class="fs-6">Một mã OTP đã được gửi tới số điện thoại: ********330</p>
                </div>
                <form id="otp-form" class="my-2">
                    <div class="otp-container">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="mx-3 btn mt-3 w-100 fs-5 text-white login-btn"><strong>Đăng nhập</strong></button>
                    </div>
                </form>
                <div class="my-4 d-flex justify-content-center phone-number">
                    <box-icon type='solid' name='phone'></box-icon>
                    <p class="text-center fs-6">Hỗ trợ kỹ thuật: <strong>0123 456 789</strong></p>
                </div>
                <div class="mb-5 d-flex justify-content-center align-items-center language-choose">
                    <div class="mx-3 language-option not-using" data-lang="en">Tiếng Anh</div>
                    <div class="separate-sign">|</div>
                    <div class="mx-3 language-option" data-lang="vi">Tiếng Việt</div>
                </div>                
            </div>
        </div>
        <div class="position-absolute bottom-0 w-100 text-center pb-4 copyright">© Copyright 2020. All Rights Reserved</div>
    </div>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</body>
</html>
